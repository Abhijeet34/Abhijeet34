<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-label="abhijeet@github — live session. Abhijeet Halder, software engineer. local-first, agent-infra, reliability. rust, tauri, typescript, react, next.js, python, shell. abhihalder343@gmail.com">
  <style>
    .t { transform-box: fill-box; transform-origin: right center; }
    .t1 { animation: type 0.7s 0.2s steps(7, end) both; }
    .t2 { animation: type 0.8s 1.7s steps(14, end) both; }
    .t3 { animation: type 0.8s 3.5s steps(16, end) both; }
    .t4 { animation: type 0.8s 4.8s steps(15, end) both; }
    @keyframes type { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .show { animation: show 0.05s linear both; }
    .s1 { animation-delay: 1.05s; } .s2 { animation-delay: 1.25s; }
    .s3 { animation-delay: 2.65s; } .s4 { animation-delay: 2.85s; } .s5 { animation-delay: 3.05s; }
    .s6 { animation-delay: 4.45s; }
    .s7 { animation-delay: 5.75s; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .p2 { animation-delay: -0.8s; } .p3 { animation-delay: -1.6s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
