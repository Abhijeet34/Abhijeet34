name: Generate metrics

# Renders a stats card as a static SVG and commits it to the repo. Generating
# and committing the asset (instead of hotlinking a shared third-party render
# service) keeps the profile reliable: the image is a file in this repo, not a
# live request that can rate-limit or 503.
#
# Scheduled + on-demand only. It must NOT run on push to main, because it
# commits github-metrics.svg to main and would retrigger itself.
#
# Optional: add a classic PAT with `repo` scope as the METRICS_TOKEN secret to
# include private contributions; with the default GITHUB_TOKEN it counts public
# activity only.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Abhijeet34
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
